name: Sourcing real Redis regression
on:
  pull_request:
  push:
    branches: [main, release/2026-09-30, codex/corrective-sourcing-release]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sourcing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:provider-evidence
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npx tsx scripts/test-request-origin.ts && npx tsx scripts/test-sourcing-routes.ts
      - run: node scripts/test-sourcing-real-redis.mjs
