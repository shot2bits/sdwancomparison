name: Sourcing real Redis regression
on:
  pull_request:
  push:
    branches: [main, release/2026-09-30, codex/corrective-sourcing-release]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sourcing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Menu scroll-lock regression
        run: node --experimental-strip-types --test tests/menu-scroll-lock.test.mjs
      - run: npm run test:rfp-completion
      - name: Shortlist React and evidence quality
        run: >-
          npx eslint src/components/SectorComparison.tsx src/components/ProviderResearchDetails.tsx
          src/lib/sector-comparison.ts src/lib/original-buyer-checklist.ts src/lib/sector-comparison-source.ts
          src/lib/provider-evidence-normalization.ts src/lib/shortlist-primary-research.ts
          src/app/api/sector-comparison/route.ts "src/app/api/sector-comparison/providers/[slug]/route.ts"
      - run: node --import tsx scripts/test-sector-comparison.ts
      - run: npm run test:provider-evidence
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: npx tsx scripts/test-request-origin.ts && npx tsx scripts/test-sourcing-routes.ts
      - run: node scripts/test-sourcing-real-redis.mjs
      - run: node scripts/test-sourcing-real-redis.mjs scripts/test-studio-integration.ts
      - run: node --import tsx scripts/test-studio-ui.mjs
      - run: node --import tsx scripts/test-admin-ui.mjs
      - run: node scripts/test-sourcing-real-redis.mjs scripts/test-admin-alerts.ts
